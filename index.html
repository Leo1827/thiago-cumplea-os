<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiago</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="main-body">

    <div id="loader" class="loader">
        <img src="https://i.gifer.com/40OX.gif" class="loader-img">
        <p class="loader-text">Cargando diversión...</p>
    </div>

    <button id="btnConfeti" class="btn-confeti">🎂</button>

    <div id="confeti-container"></div>

    <div class="fondo-img"></div>
    <div class="luz-superior"></div>

    <div class="hero-container">
        <div class="hero-wrapper">
            <div class="ring-wrapper">
                <div class="ring-element animate-spin-slow"></div>
            </div>

            <div class="rayos-wrapper">
                <div class="rayos-container">
                    <img src="img/effect.gif" autoplay loop muted class="rayo r1">
                    <img src="img/effect.gif" autoplay loop muted class="rayo r2">
                    <img src="img/effect.gif" autoplay loop muted class="rayo r3">
                    <img src="img/effect.gif" autoplay loop muted class="rayo r4">
                    <img src="img/effect.gif" autoplay loop muted class="rayo r5">
                    <img src="img/effect.gif" autoplay loop muted class="rayo r6">
                </div>
            </div>
            
            <div class="hero-circle"></div>

            <img src="img/city.png" class="city-img">

            <div class="carretera-container">
                <img src="img/carretera.png" class="carretera-img road-position">
            </div>

            <img id="imagenSonic" src="img/sonic.png" class="sonic-img"> 

            <h1 class="main-title animate-glow">THIAGO</h1>
        </div>
    </div>

    <div class="separador-sonic">
        <div class="linea linea-izq"></div>
        <div class="linea linea-der"></div>
        <h2 class="texto-sonic">
            Te invitamos a celebrar juntos<br>
            <span>Mis 5 años</span>
        </h2>
    </div>

    <section class="event-section">
        <div class="card-container">
            <div class="card-info-list">
                
                <div class="flex-center">
                    <div class="date-badge">
                        <div class="text-center">
                            <p class="badge-label">Domingo</p>
                            <p class="badge-day">26</p>
                        </div>
                        <div class="badge-divider"></div>
                        <div class="text-center">
                            <p class="badge-label">Abril</p>
                            <p class="badge-year">2026</p>
                        </div>
                    </div>
                </div>

                <div class="flex-center">
                    <div class="info-badge glow-box">
                        <div class="badge-icon">⏰</div>
                        <div class="text-left">
                            <p class="badge-label">Hora</p>
                            <p class="badge-text-val">4:30 PM</p>
                        </div>
                    </div>
                </div>

                <div class="flex-center">
                    <div class="info-badge glow-box max-w-md">
                        <div class="badge-icon">📍</div>
                        <div class="text-left">
                            <p class="badge-label">Lugar</p>
                            <p class="badge-text-val leading-tight">
                                Salón Comunal<br>
                                Los Mandarinos
                            </p>
                        </div>
                    </div>
                </div>

                <div class="map-wrapper">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3977.7676625863824!2d-75.2032546!3d4.4542626!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e38c503fe86b16f%3A0x642fff6996f3fcf5!2sCaseta%20comunal%20Los%20Mandarinos!5e0!3m2!1ses-419!2sco!4v1776193215778!5m2!1ses-419!2sco"
                        width="100%" 
                        height="300" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy">
                    </iframe>
                </div>

            </div>

            <a href="https://wa.me/573246037753?text=Hola,%20confirmo%20la%20asistencia%20al%20cumpleaños%20de%20Thiago%20a%20las%204:30pm" target="_blank" class="btn-whatsapp">

                    <span>Confirmar asistencia</span>

            </a>
        </div>

        <img src="https://i.gifer.com/3F3F.gif" class="gif-bottom" />
    </section>

    <script src="js/script.js"></script>
</body>
</html>
